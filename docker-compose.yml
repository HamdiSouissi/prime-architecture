services:
  app:
    build:
      context: .
      target: app
    environment:
      APP_ENV: local
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:-http://localhost:8080}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-archi_tn}
      DB_USERNAME: ${DB_USERNAME:-archi}
      DB_PASSWORD: ${DB_PASSWORD:-archi_local_only}
      SESSION_DRIVER: database
      ADMIN_NAME: ${ADMIN_NAME:-Administrator}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      PASSWORD_MIN_LENGTH: ${PASSWORD_MIN_LENGTH:-10}
      PASSWORD_CHECK_COMPROMISED: ${PASSWORD_CHECK_COMPROMISED:-true}
      INVITATION_EXPIRY_MINUTES: ${INVITATION_EXPIRY_MINUTES:-1440}
      DOCUMENT_MAX_FILE_KB: ${DOCUMENT_MAX_FILE_KB:-25600}
      DOCUMENT_MAX_ZIP_BYTES: ${DOCUMENT_MAX_ZIP_BYTES:-262144000}
      DOCUMENT_MAX_ZIP_FILES: ${DOCUMENT_MAX_ZIP_FILES:-50}
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-hello@example.com}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Archi TN}
    volumes:
      - app_runtime:/var/www/runtime
      - app_storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -s /var/www/runtime/.env && grep -q '^APP_KEY=base64:' /var/www/runtime/.env && php-fpm -t >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 12
  web:
    build:
      context: .
      target: web
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      - app
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-archi_tn}
      MYSQL_USER: ${DB_USERNAME:-archi}
      MYSQL_PASSWORD: ${DB_PASSWORD:-archi_local_only}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
  mailpit:
    image: axllent/mailpit:v1.27.2
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"
  phpmyadmin:
    image: phpmyadmin:5
    profiles: ["dev"]
    environment:
      PMA_HOST: db
    ports:
      - "127.0.0.1:${PHPMYADMIN_PORT:-8081}:80"
    depends_on:
      db:
        condition: service_healthy
volumes:
  mysql_data:
  app_runtime:
  app_storage:
