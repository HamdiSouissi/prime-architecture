services:
  app:
    build:
      context: .
      target: app
    environment:
      APP_ENV: local
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:-http://localhost:8080}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-archi_tn}
      DB_USERNAME: ${DB_USERNAME:-archi}
      DB_PASSWORD: ${DB_PASSWORD:-archi_local_only}
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-hello@example.com}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Archi TN}
    volumes:
      - app_runtime:/var/www/runtime
      - app_storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
  web:
    build:
      context: .
      target: web
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      - app
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-archi_tn}
      MYSQL_USER: ${DB_USERNAME:-archi}
      MYSQL_PASSWORD: ${DB_PASSWORD:-archi_local_only}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
  mailpit:
    image: axllent/mailpit:v1.27.2
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"
  phpmyadmin:
    image: phpmyadmin:5
    profiles: ["dev"]
    environment:
      PMA_HOST: db
    ports:
      - "127.0.0.1:${PHPMYADMIN_PORT:-8081}:80"
    depends_on:
      db:
        condition: service_healthy
volumes:
  mysql_data:
  app_runtime:
  app_storage:
