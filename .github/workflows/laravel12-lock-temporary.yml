name: Generate Laravel 12 lock (temporary)
on:
  push:
    branches: ['arena/a7217585-prime-architecture']
    paths: ['.github/workflows/laravel12-lock-temporary.yml']
permissions:
  contents: write
jobs:
  update:
    if: github.ref == 'refs/heads/arena/a7217585-prime-architecture'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mbstring, intl, zip
          coverage: none
      - name: Resolve and audit dependencies
        run: |
          if ! composer update --with-all-dependencies --no-interaction --prefer-dist --no-progress --no-scripts > composer-result.txt 2>&1; then
            cat composer-result.txt
            echo "::error title=Composer update::$(tail -c 5000 composer-result.txt | tr '\r\n' '  ')"
            exit 1
          fi
          composer audit --locked --no-interaction
      - name: Commit lock to session branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add composer.lock
          if ! git diff --cached --quiet; then
            git commit -m 'chore: lock laravel 12 dependencies'
            git push origin HEAD:arena/a7217585-prime-architecture
          fi
