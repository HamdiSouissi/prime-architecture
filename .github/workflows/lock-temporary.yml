name: Generate Composer lock (temporary)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  lock:
    if: github.ref == 'refs/heads/arena/a74fd998-prime-architecture'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mbstring, intl, zip
          coverage: none
      - run: composer update --no-interaction --prefer-dist --no-progress --no-scripts
      - name: Commit lock to the session branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add composer.lock
          if ! git diff --cached --quiet; then
            git commit -m 'chore: lock composer dependencies'
            git push origin HEAD:arena/a74fd998-prime-architecture
          fi
