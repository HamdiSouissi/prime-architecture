name: CI
on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_root_only
          MYSQL_DATABASE: archi_tn
          MYSQL_USER: archi
          MYSQL_PASSWORD: ci_only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      APP_ENV: testing
      APP_KEY: base64:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: archi_tn
      DB_USERNAME: archi
      DB_PASSWORD: ci_only
      SESSION_DRIVER: file
      CACHE_STORE: file
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mbstring, intl, zip
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: cp .env.example .env
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: npm ci && npm run build
      - name: Migrate database
        run: |
          if ! php artisan migrate --force --no-interaction > migration-result.txt 2>&1; then
            cat migration-result.txt
            echo "::error title=Migration::$(head -c 4000 migration-result.txt | tr '\r\n' '  ')"
            exit 1
          fi
      - name: Run tests
        run: |
          if ! php artisan test --no-ansi > test-result.txt 2>&1; then
            cat test-result.txt
            echo "::error title=Tests::$(tail -c 4000 test-result.txt | tr '\r\n' '  ')"
            exit 1
          fi
      - name: Check PHP formatting
        run: |
          if ! vendor/bin/pint --test --format=json > pint-result.json 2>&1; then
            head -c 8000 pint-result.json
            echo
            echo "::error title=Pint::$(head -c 4000 pint-result.json | tr '\r\n' '  ')"
            exit 1
          fi
      - name: Analyse PHP
        run: |
          if ! vendor/bin/phpstan analyse --no-progress --error-format=raw > phpstan-result.txt 2>&1; then
            cat phpstan-result.txt
            echo "::error title=PHPStan::$(head -c 4000 phpstan-result.txt | tr '\r\n' '  ')"
            exit 1
          fi
  docker-smoke:
    runs-on: ubuntu-latest
    env:
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: CI-admin-password-123
      PASSWORD_CHECK_COMPROMISED: 'false'
    steps:
      - uses: actions/checkout@v4
      - name: Build and start services
        run: docker compose up -d --build --wait
      - name: Apply migrations
        run: docker compose exec -T -u www-data app php artisan migrate --force --no-interaction
      - name: Verify French and Arabic pages
        run: |
          curl --fail --silent --show-error -c cookies.txt http://localhost:8080/ > home.html
          grep -q 'lang="fr" dir="ltr"' home.html
          token=$(python3 -c 'import re; print(re.search(r"name=\"_token\" value=\"([^\"]+)", open("home.html").read()).group(1))')
          curl --fail --silent --show-error -b cookies.txt -c cookies.txt -d "_token=$token&locale=ar" http://localhost:8080/locale -o /dev/null
          curl --fail --silent --show-error -b cookies.txt http://localhost:8080/ > arabic.html
          grep -q 'lang="ar" dir="rtl"' arabic.html
      - name: Seed roles and initial administrator
        run: |
          docker compose exec -T -u www-data app php artisan db:seed --class=RolePermissionSeeder --force
          docker compose exec -T -u www-data app php artisan db:seed --class=InitialAdminSeeder --force
      - name: Verify invitation through Mailpit
        run: |
          if ! python3 tests/smoke/docker_phase2.py > smoke-result.txt 2>&1; then
            cat smoke-result.txt
            echo "::error title=Invitation smoke test::$(tail -c 2000 smoke-result.txt | tr '\r\n' '  ')"
            exit 1
          fi
      - name: Verify Mailpit receives email
        run: |
          docker compose exec -T -u www-data app php -r 'require "vendor/autoload.php"; $app = require "bootstrap/app.php"; $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap(); Illuminate\Support\Facades\Mail::raw("Archi TN smoke test", function ($message) { $message->to("test@example.com")->subject("Smoke test"); });'
          curl --fail --silent --show-error http://127.0.0.1:8025/api/v1/messages | python3 -c 'import json,sys; assert json.load(sys.stdin)["total"] >= 1'
      - name: Collect container logs on failure
        if: failure()
        run: docker compose logs --no-color app web mailpit
      - name: Summarize Laravel errors from CI environment
        if: failure()
        run: |
          docker compose exec -T -u www-data app sh -c 'grep -h "\.ERROR:" storage/logs/laravel-*.log 2>/dev/null | tail -3 | head -c 3500 || true' > laravel-error.txt || true
          if test -s laravel-error.txt; then
            echo "::error title=Laravel log::$(tr '\r\n' '  ' < laravel-error.txt)"
          fi
      - name: Clean up
        if: always()
        run: docker compose down -v
