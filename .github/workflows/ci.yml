name: CI
on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_root_only
          MYSQL_DATABASE: archi_tn
          MYSQL_USER: archi
          MYSQL_PASSWORD: ci_only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      APP_ENV: testing
      APP_KEY: base64:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: archi_tn
      DB_USERNAME: archi
      DB_PASSWORD: ci_only
      SESSION_DRIVER: file
      CACHE_STORE: file
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mbstring, intl, zip
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: npm ci && npm run build
      - run: php artisan migrate --force --no-interaction
      - run: php artisan test
      - name: Check PHP formatting
        run: |
          if ! vendor/bin/pint --test --format=json > pint-result.json 2>&1; then
            head -c 8000 pint-result.json
            echo
            echo "::error title=Pint::$(head -c 4000 pint-result.json | tr '\r\n' '  ')"
            exit 1
          fi
      - run: vendor/bin/phpstan analyse --no-progress
