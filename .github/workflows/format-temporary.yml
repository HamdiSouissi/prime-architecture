name: Format PHP (temporary)
on:
  push:
    branches: ['arena/a74fd998-prime-architecture']
    paths: ['.github/workflows/format-temporary.yml']
permissions:
  contents: write
jobs:
  format:
    if: github.ref == 'refs/heads/arena/a74fd998-prime-architecture'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mbstring, intl, zip
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: vendor/bin/pint
      - name: Commit formatting to session branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app bootstrap config database lang routes tests
          if ! git diff --cached --quiet; then
            git commit -m 'style: apply laravel pint'
            git push origin HEAD:arena/a74fd998-prime-architecture
          fi
